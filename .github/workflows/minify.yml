name: Minify selected CSS/JS

on:
  push:
    branches: [ "main" ]
    paths:
      - "assets/guitar.css"
      - "assets/guitar.js"
      - "assets/guzheng.css"
      - "assets/guzheng.js"
      - "assets/footer.css"
      - "assets/footer.js"

permissions:
  contents: write

jobs:
  minify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Minify CSS (Toptal)
        env:
          TOOPTAL_CSS_URL: "https://www.toptal.com/developers/cssminifier/api/raw"
        run: |
          set -e
          for f in assets/guitar.css assets/guzheng.css assets/footer.css; do
            out="${f%.css}.min.css"
            echo "Minifying $f -> $out"
            curl -sS -X POST \
              --data-urlencode "input@${f}" \
              "${TOOPTAL_CSS_URL}" > "${out}"
          done

      - name: Minify JS (Toptal)
        env:
          TOOPTAL_JS_URL: "https://www.toptal.com/developers/javascript-minifier/api/raw"
        run: |
          set -e
          for f in assets/guitar.js assets/guzheng.js assets/footer.js; do
            out="${f%.js}.min.js"
            echo "Minifying $f -> $out"
            curl -sS -X POST \
              --data-urlencode "input@${f}" \
              "${TOOPTAL_JS_URL}" > "${out}"
          done

      - name: Commit and push minified files
        run: |
          set -e
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git add -f assets/**/*.min.css assets/**/*.min.js || true

          if git diff --cached --quiet; then
            echo "No minified changes."
            exit 0
          fi

          git commit -m "chore: auto-minify selected assets" || true
          git push
