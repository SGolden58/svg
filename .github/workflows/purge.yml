name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr
        run: |
          # This command tells jsDelivr to clear the cache for your main branch
          curl -i https://purge.jsdelivr.net/gh/SGolden58/svg@main/
          
          # If you have specific important files, you can add them here too:
          # curl -i https://purge.jsdelivr.net/gh/SGolden58/svg@main/your-file.svg
