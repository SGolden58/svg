name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Changed Files
        run: |
          # This gets the list of every file you just uploaded/changed
          FILES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.files[].filename')

          # This loops through every file, no matter which folder it is in
          echo "$FILES" | while read -r FILE; do
            if [ -n "$FILE" ]; then
              # Fixes spaces for folders like "SVG Guitar"
              ENCODED_FILE=$(echo "$FILE" | sed 's/ /%20/g')
              
              echo "Refreshing: $ENCODED_FILE"
              
              # Tells jsDelivr to clear the cache for this specific file
              curl -s -o /dev/null -w "Result for $FILE: %{http_code}\n" \
                "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$ENCODED_FILE"
            fi
          done

          # Final step: Refresh the root so the folder list updates
          curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/"
          echo "All changed files have been submitted for refresh."
