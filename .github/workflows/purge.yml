name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge via API
        run: |
          # We manually fetch the list of changed files using the GitHub API 
          # instead of checking out the code. This avoids the Node.js warning.
          
          FILES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.files[].filename')

          for FILE in $FILES; do
            echo "Purging: $FILE"
            curl -s -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$FILE"
          done
          
          # Purge the root directory as well
          curl -s -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/"
