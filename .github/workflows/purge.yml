name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr
        run: |
          # This command tells jsDelivr to clear the cache for your main branch
          curl -i https://purge.jsdelivr.net/gh/SGolden58/svg@main/
            https://cdn.jsdelivr.net/gh/SGolden58/svg@main/SVG%20Guitar/
            https://cdn.jsdelivr.net/gh/SGolden58/svg@main/SVG%20Guzheng/
            https://cdn.jsdelivr.net/gh/SGolden58/svg@main/SVG%20Ukulele/
            https://cdn.jsdelivr.net/gh/SGolden58/svg@main/SVG%20Piano/
            https://cdn.jsdelivr.net/gh/SGolden58/svg@main/SVG%20Violin/
            https://cdn.jsdelivr.net/gh/SGolden58/svg@main/SVG%20Destination/
            https://cdn.jsdelivr.net/gh/SGolden58/svg@main/Spotlight/

