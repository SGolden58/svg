name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr CDN cache
        run: |
          # 1. Purge the Root (Corrected typo: repository)
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/"
          
          # 2. Get the list of changed files
          FILES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.files[].filename')

          # 3. Purge each file individually (This is the only way it actually refreshes)
          for FILE in $FILES; do
            ENCODED_FILE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$FILE'))")
            echo "Purging: $ENCODED_FILE"
            curl -s -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$ENCODED_FILE"
          done
