name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge via API
        run: |
          # 1. Get the list of changed files
          FILES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.files[].filename')

          # 2. Loop through files and purge
          echo "$FILES" | while read -r FILE; do
            if [ -n "$FILE" ]; then
              # Replace spaces with %20 for the URL
              ENCODED_FILE=$(echo "$FILE" | sed 's/ /%20/g')
              
              echo "Purging: $ENCODED_FILE"
              
              # Send the purge request
              curl -s -i "https://purge.jsdelivr.net/gh/SGolden58/svg@main/$ENCODED_FILE"
            fi
          done

          # 3. Force purge the specific Guitar background just in case
          curl -s -i "https://purge.jsdelivr.net/gh/SGolden58/svg@main/SVG%20Guitar/Guitar-background.webp"
