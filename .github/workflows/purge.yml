name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge via API
        run: |
          # Fetch changed files
          FILES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}" \
            | jq -r '.files[].filename')

          # Loop through each file
          echo "$FILES" | while read -r FILE; do
            if [ -n "$FILE" ]; then
              # Construct the URL and replace spaces with %20 for the API
              ENCODED_FILE=$(echo "$FILE" | sed 's/ /%20/g')
              echo "Purging: $ENCODED_FILE"
              curl -s -o /dev/null -w "%{http_code} " "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$ENCODED_FILE"
            fi
          done
          
          # Also purge the root directory
          curl -s -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/"
